<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7ed">
<title>오늘의 점심메뉴</title>
<style>
  :root {
    --bg: #fff7ed;
    --ink: #2b2118;
    --muted: #8a7766;
    --die: #ffffff;
    --die-edge: #e9dccd;
    --accent: #ef4444;
    --accent-2: #f59e0b;
    --gap: clamp(10px, 3vw, 14px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: radial-gradient(circle at 50% 0%, #ffedd5 0%, var(--bg) 60%);
    color: var(--ink);
    min-height: 100%;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 560px; margin: 0 auto; }

  header { text-align: center; margin-bottom: clamp(14px, 4vw, 22px); }
  header h1 { font-size: clamp(22px, 6.5vw, 32px); letter-spacing: -0.5px; }
  header p { color: var(--muted); font-size: clamp(12px, 3.5vw, 14px); margin-top: 4px; }

  /* ===== 3x7 주사위 보드 (3열 × 7행) ===== */
  .board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    max-width: 420px;
    margin: 0 auto;
    gap: var(--gap);
    perspective: 800px;
  }
  .die {
    position: relative;
    aspect-ratio: 1 / 1;
    background: linear-gradient(145deg, #ffffff 0%, #fbf5ee 100%);
    border-radius: 18%;
    box-shadow:
      inset 0 -4px 0 var(--die-edge),
      inset 0 2px 0 #fff,
      0 4px 8px rgba(80, 50, 20, .12);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2%;
    cursor: pointer;
    user-select: none;
    transition: transform .2s ease, box-shadow .2s ease;
    overflow: hidden;
    min-width: 0;
  }
  .die:active { transform: scale(.95); }
  /* 주사위 모서리 점(pip) 장식 */
  .die::before, .die::after {
    content: "";
    position: absolute;
    width: 9%; height: 9%;
    border-radius: 50%;
    background: #d9c8b6;
  }
  .die::before { top: 9%; left: 9%; }
  .die::after  { bottom: 12%; right: 9%; }
  .die .emoji {
    font-size: clamp(30px, 11vw, 48px);
    line-height: 1;
  }
  .die .name {
    font-size: clamp(12px, 3.8vw, 15px);
    font-weight: 600;
    color: var(--ink);
    max-width: 92%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  .die.rolling { animation: wobble .45s ease-in-out infinite; }
  .die.rolling:nth-child(3n)  { animation-delay: -.15s; }
  .die.rolling:nth-child(3n+1){ animation-delay: -.3s; }
  .die.lit {
    background: linear-gradient(145deg, #fff1c2, #ffd36b);
    box-shadow: inset 0 -4px 0 #e0a92b, 0 0 0 3px var(--accent-2), 0 6px 14px rgba(245,158,11,.35);
  }
  .die.picked {
    background: linear-gradient(145deg, #ff8a8a, var(--accent));
    box-shadow: inset 0 -4px 0 #b91c1c, 0 0 0 3px #fff, 0 0 0 6px var(--accent), 0 8px 18px rgba(239,68,68,.4);
    animation: pop .5s ease;
    z-index: 2;
  }
  .die.picked .name { color: #fff; }
  .die.picked::before, .die.picked::after { background: rgba(255,255,255,.7); }
  .die.excluded { opacity: .3; filter: grayscale(1); }

  @keyframes wobble {
    0%   { transform: rotateX(0) rotateY(0) rotateZ(0); }
    25%  { transform: rotateX(25deg) rotateY(-20deg) rotateZ(-8deg) scale(.95); }
    50%  { transform: rotateX(-15deg) rotateY(25deg) rotateZ(6deg); }
    75%  { transform: rotateX(20deg) rotateY(10deg) rotateZ(-4deg) scale(.97); }
    100% { transform: rotateX(0) rotateY(0) rotateZ(0); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.25) rotate(-6deg); }
    70% { transform: scale(.95) rotate(3deg); }
    100% { transform: scale(1.08); }
  }

  /* ===== 버튼 / 결과 ===== */
  .controls { max-width: 420px; margin-left: auto; margin-right: auto; margin-top: clamp(16px, 5vw, 24px); display: flex; flex-direction: column; gap: 10px; }
  .roll-btn {
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: clamp(14px, 4vw, 18px);
    font-size: clamp(16px, 4.8vw, 20px);
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #f97316);
    box-shadow: 0 5px 0 #b91c1c, 0 10px 20px rgba(239,68,68,.25);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
    font-family: inherit;
  }
  .roll-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b91c1c, 0 4px 10px rgba(239,68,68,.25); }
  .roll-btn:disabled { opacity: .7; cursor: default; }
  .hint { text-align: center; color: var(--muted); font-size: clamp(11px, 3.2vw, 13px); }

  .result {
    max-width: 420px;
    margin-left: auto; margin-right: auto;
    margin-top: clamp(14px, 4vw, 20px);
    background: #fff;
    border-radius: 20px;
    padding: clamp(16px, 5vw, 24px);
    text-align: center;
    box-shadow: 0 6px 20px rgba(80,50,20,.1);
    display: none;
  }
  .result.show { display: block; animation: rise .4s ease; }
  .result .label { color: var(--muted); font-size: clamp(12px, 3.5vw, 14px); }
  .result .big { font-size: clamp(56px, 18vw, 84px); line-height: 1.1; margin: 6px 0; }
  .result .menu { font-size: clamp(22px, 7vw, 30px); font-weight: 800; }
  .result .desc { color: var(--muted); font-size: clamp(12px, 3.6vw, 14px); margin-top: 6px; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .die.rolling, .die.picked, .result.show { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎲 오늘의 점심메뉴</h1>
    <p id="today"></p>
  </header>

  <main>
    <div class="board" id="board" aria-label="점심 메뉴 주사위 3x7"></div>

    <div class="controls">
      <button class="roll-btn" id="rollBtn">주사위 굴리기</button>
      <p class="hint">먹기 싫은 메뉴는 탭해서 빼 두세요</p>
    </div>

    <section class="result" id="result" aria-live="polite">
      <div class="label">오늘 점심은</div>
      <div class="big" id="resEmoji"></div>
      <div class="menu" id="resName"></div>
      <div class="desc" id="resDesc"></div>
    </section>
  </main>
</div>

<script>
  const MENUS = [
    { e: "🥬", n: "김치찌개",  d: "얼큰하게 밥 한 공기 뚝딱" },
    { e: "🍲", n: "된장찌개",  d: "구수한 집밥 스타일" },
    { e: "🥘", n: "부대찌개",  d: "라면사리 추가는 필수" },
    { e: "🌶️", n: "짬뽕",      d: "불맛 가득 얼큰한 국물" },
    { e: "🥢", n: "짜장면",    d: "실패 없는 국민 메뉴" },
    { e: "🍖", n: "제육볶음",  d: "매콤달콤 밥도둑" },
    { e: "🥩", n: "돈까스",    d: "바삭한 튀김옷에 소스 듬뿍" },
    { e: "🍣", n: "초밥",      d: "가볍고 깔끔하게" },
    { e: "🍛", n: "카레",      d: "든든하고 빠르게" },
    { e: "🍝", n: "파스타",    d: "분위기 내고 싶은 날" },
    { e: "🍔", n: "햄버거",    d: "빠르고 확실한 한 끼" },
    { e: "🌯", n: "샌드위치",  d: "가볍게 먹고 산책까지" },
    { e: "🥗", n: "샐러드",    d: "오늘은 건강하게" },
    { e: "🍱", n: "도시락",    d: "골라 먹는 재미" },
    { e: "🍙", n: "김밥·분식", d: "떡볶이랑 같이" },
    { e: "🐔", n: "닭갈비",    d: "볶음밥으로 마무리" },
    { e: "🍗", n: "치킨",      d: "점심 치킨도 인정" },
    { e: "🍥", n: "라멘",      d: "진한 국물이 당길 때" },
    { e: "🥣", n: "국밥",      d: "든든함 끝판왕" },
    { e: "🍜", n: "쌀국수",    d: "시원하고 깔끔한 국물" },
    { e: "🥡", n: "마라탕",    d: "얼얼하게 스트레스 해소" }
  ];

  const board = document.getElementById("board");
  const btn = document.getElementById("rollBtn");
  const result = document.getElementById("result");
  const excluded = new Set();
  let rolling = false;

  // 날짜 표시
  const now = new Date();
  const days = ["일","월","화","수","목","금","토"];
  document.getElementById("today").textContent =
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;

  // 보드 그리기
  const dice = MENUS.map((m, i) => {
    const el = document.createElement("div");
    el.className = "die";
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", m.n);
    el.innerHTML = `<span class="emoji">${m.e}</span><span class="name">${m.n}</span>`;
    el.addEventListener("click", () => {
      if (rolling) return;
      if (excluded.has(i)) { excluded.delete(i); el.classList.remove("excluded"); }
      else if (excluded.size < MENUS.length - 1) { excluded.add(i); el.classList.add("excluded"); }
      el.classList.remove("picked");
    });
    board.appendChild(el);
    return el;
  });

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  btn.addEventListener("click", async () => {
    if (rolling) return;
    rolling = true;
    btn.disabled = true;
    btn.textContent = "데구르르…";
    result.classList.remove("show");
    dice.forEach(d => d.classList.remove("picked", "lit"));

    const pool = MENUS.map((_, i) => i).filter(i => !excluded.has(i));
    pool.forEach(i => dice[i].classList.add("rolling"));

    // 하이라이트가 점점 느려지며 이동
    let last = -1, delay = 50;
    const steps = 18 + Math.floor(Math.random() * 8);
    for (let s = 0; s < steps; s++) {
      let next;
      do { next = pool[Math.floor(Math.random() * pool.length)]; }
      while (pool.length > 1 && next === last);
      if (last >= 0) dice[last].classList.remove("lit");
      dice[next].classList.add("lit");
      last = next;
      if (navigator.vibrate) navigator.vibrate(8);
      await sleep(delay);
      delay *= 1.08;
    }

    pool.forEach(i => dice[i].classList.remove("rolling"));
    dice[last].classList.remove("lit");
    dice[last].classList.add("picked");
    if (navigator.vibrate) navigator.vibrate([30, 40, 60]);

    const m = MENUS[last];
    document.getElementById("resEmoji").textContent = m.e;
    document.getElementById("resName").textContent = m.n;
    document.getElementById("resDesc").textContent = m.d;
    result.classList.add("show");
    result.scrollIntoView({ behavior: "smooth", block: "center" });

    btn.disabled = false;
    btn.textContent = "다시 굴리기";
    rolling = false;
  });
</script>
</body>
</html>
